

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>背单词 · 闪卡 + 间隔重复</title>
<style>
:root{
  --bg:#f5f6f8; --panel:#ffffff; --line:#e6e8ec; --line-2:#f0f1f4;
  --text:#1c1f24; --muted:#6b7280; --muted-2:#9aa1ab;
  --brand:#2f6feb; --brand-soft:#e9f0ff; --brand-line:#c9dcff;
  --ok:#15803d; --ok-soft:#e8f8ee; --bad:#d92d4b; --bad-soft:#fdecef;
  --warn:#b45309; --warn-soft:#fdf3e3;
  --radius:14px; --radius-sm:9px;
  --shadow:0 1px 2px rgba(16,24,40,.05), 0 10px 28px rgba(16,24,40,.06);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--text);
  font:15px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  -webkit-font-smoothing:antialiased;
}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.wrap{max-width:1000px;margin:0 auto;padding:0 16px 64px}

/* ---------- 顶栏 ---------- */
.topbar{
  position:sticky;top:0;z-index:30;background:rgba(255,255,255,.92);
  backdrop-filter:saturate(160%) blur(8px);border-bottom:1px solid var(--line);
}
.topbar-inner{max-width:1000px;margin:0 auto;padding:12px 16px;display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.brand{font-weight:700;font-size:17px;letter-spacing:.3px;margin-right:4px;white-space:nowrap}
.brand span{color:var(--brand)}
.grow{flex:1 1 200px;min-width:160px}
input[type=text],input[type=url],select,textarea{
  width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:var(--radius-sm);
  background:#fff;outline:none;transition:border-color .15s, box-shadow .15s;
}
input[type=text]:focus,input[type=url]:focus,select:focus,textarea:focus{
  border-color:var(--brand-line);box-shadow:0 0 0 3px var(--brand-soft);
}
.btn{
  border:1px solid var(--line);background:#fff;border-radius:var(--radius-sm);
  padding:10px 14px;min-height:42px;white-space:nowrap;
  transition:background .15s,border-color .15s,transform .06s;
}
.btn:hover{background:#fafbfc;border-color:#d8dbe1}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.primary:hover{background:#2a63d4;border-color:#2a63d4}
.btn.ok{background:var(--ok-soft);border-color:#c4e8d3;color:var(--ok)}
.btn.bad{background:var(--bad-soft);border-color:#f6ccd5;color:var(--bad)}
.btn.ghost{background:transparent}
.btn.sm{padding:6px 10px;min-height:34px;font-size:13px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:var(--radius-sm);overflow:hidden;background:#fff}
.seg button{border:0;background:transparent;padding:10px 14px;min-height:42px;color:var(--muted)}
.seg button.active{background:var(--brand);color:#fff;font-weight:600}

/* ---------- 标签页 ---------- */
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:18px 0 14px}
.tabs button{
  border:1px solid var(--line);background:#fff;border-radius:999px;padding:9px 16px;min-height:40px;color:var(--muted)
}
.tabs button.active{background:var(--brand-soft);border-color:var(--brand-line);color:var(--brand);font-weight:600}

.card-panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px}
.muted{color:var(--muted)}
.small{font-size:13px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.hidden{display:none !important}

/* ---------- 闪卡 ---------- */
.study-head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.pill{display:inline-flex;align-items:center;gap:6px;background:var(--line-2);border-radius:999px;padding:4px 12px;font-size:13px;color:var(--muted)}
.pill.lv{background:var(--brand-soft);color:var(--brand)}
.progress{height:6px;background:var(--line-2);border-radius:999px;overflow:hidden;margin-bottom:16px}
.progress > i{display:block;height:100%;background:var(--brand);width:0;transition:width .25s}

.card{perspective:1400px;margin:0 auto;max-width:640px}
.card-inner{
  position:relative;width:100%;min-height:360px;
  transition:transform .5s cubic-bezier(.2,.7,.2,1);transform-style:preserve-3d;
}
.card.flipped .card-inner{transform:rotateY(180deg)}
.face{
  position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;
  background:#fff;border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);
  padding:26px;display:flex;flex-direction:column;overflow:auto;
}
.face.back{transform:rotateY(180deg)}
.face .hint{position:absolute;right:16px;bottom:12px;font-size:12px;color:var(--muted-2)}
.word{font-size:44px;font-weight:700;letter-spacing:.4px;line-height:1.25;word-break:break-word}
.word.zh{font-size:34px}
.phon{color:var(--brand);font-size:17px;margin-top:6px}
.zh-mean{font-size:22px;font-weight:600;margin-top:10px}
.example{
  margin-top:auto;padding-top:16px;border-top:1px dashed var(--line);color:var(--muted);
  font-size:15px;line-height:1.7;white-space:pre-wrap;word-break:break-word;
}
.pic{margin-top:12px}
.pic img{max-width:100%;max-height:200px;border-radius:10px;display:block;border:1px solid var(--line)}
.pic .ph{
  border:1px dashed var(--line);border-radius:10px;padding:14px;color:var(--muted-2);
  font-size:13px;text-align:center;background:#fafbfc;
}
.speak{
  display:inline-flex;align-items:center;gap:8px;border:1px solid var(--brand-line);background:var(--brand-soft);
  color:var(--brand);border-radius:999px;padding:8px 16px;min-height:40px;font-weight:600
}
.speak:hover{background:#dfe9ff}
.study-actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:20px}
.study-actions .btn{min-width:120px;justify-content:center;font-weight:600}
.empty{text-align:center;padding:40px 20px}
.empty h3{margin:0 0 8px;font-size:19px}
.stats{display:flex;gap:18px;justify-content:center;margin:16px 0}
.stat{text-align:center}
.stat b{display:block;font-size:26px}
.stat span{font-size:12px;color:var(--muted)}

/* ---------- 表格 ---------- */
.table-wrap{overflow:auto;border:1px solid var(--line);border-radius:var(--radius-sm);background:#fff}
table{border-collapse:collapse;width:100%;min-width:820px;font-size:14px}
th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--line-2);vertical-align:top}
th{background:#fafbfc;font-weight:600;color:var(--muted);position:sticky;top:0;z-index:1}
tr:last-child td{border-bottom:0}
td.en{font-weight:600}
td.nowrap{white-space:nowrap}
.tiny{font-size:12px;color:var(--muted-2)}

/* ---------- 表单 ---------- */
.field{margin-bottom:10px}
.field label{display:block;font-size:13px;color:var(--muted);margin-bottom:5px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:720px){ .grid2{grid-template-columns:1fr} }

/* ---------- 弹窗 ---------- */
.mask{
  position:fixed;inset:0;background:rgba(17,20,26,.45);display:flex;align-items:center;justify-content:center;
  padding:20px;z-index:60
}
.modal{
  background:#fff;border-radius:16px;box-shadow:0 24px 60px rgba(0,0,0,.24);
  width:100%;max-width:720px;max-height:88vh;display:flex;flex-direction:column;overflow:hidden
}
.modal h3{margin:0;padding:16px 20px;border-bottom:1px solid var(--line);font-size:16px}
.modal .body{padding:18px 20px;overflow:auto}
.modal .foot{padding:14px 20px;border-top:1px solid var(--line);display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}

/* ---------- 导入预览 ---------- */
.maptable{width:100%;min-width:0;font-size:13px}
.maptable th,.maptable td{padding:7px 9px}
.maptable select{padding:6px 8px;border-radius:7px}
.sample{color:var(--muted);font-size:12px;max-width:260px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ---------- 提示 ---------- */
#toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);z-index:90;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
#toast div{
  background:#1c1f24;color:#fff;padding:10px 16px;border-radius:999px;font-size:14px;
  box-shadow:0 8px 24px rgba(0,0,0,.2);animation:pop .18s ease-out
}
#toast div.bad{background:#b3122f}
#toast div.ok{background:#14532d}
@keyframes pop{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

.chk{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);white-space:nowrap;cursor:pointer;user-select:none}
.chk input{width:auto;margin:0}
#noticeBar:empty{display:none}
.notice{
  display:flex;align-items:center;gap:12px;flex-wrap:wrap;
  background:var(--brand-soft);border:1px solid var(--brand-line);color:#1b3a6b;
  border-radius:var(--radius-sm);padding:10px 14px;margin-bottom:12px;font-size:14px
}
.nbar{flex:1 1 120px;height:6px;background:#fff;border-radius:999px;overflow:hidden;min-width:80px}
.nbar > i{display:block;height:100%;background:var(--brand);width:0;transition:width .2s}

.sr-head{display:flex;gap:14px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap}
.sr-en{font-size:30px;font-weight:700;line-height:1.2}
.sr-badges{display:flex;gap:6px;flex-wrap:wrap}
.sr-badge{background:var(--brand-soft);border:1px solid var(--brand-line);color:var(--brand);border-radius:999px;padding:3px 11px;font-size:12px}
.sr-list{display:flex;flex-direction:column;gap:6px;max-height:420px;overflow:auto;margin-top:10px}
.sr-row{display:flex;gap:10px;align-items:center;justify-content:space-between;border:1px solid var(--line);border-radius:10px;padding:8px 12px;background:#fff}
.sr-row:hover{border-color:var(--brand-line);background:#fafcff}
.sr-row .en{font-weight:600;min-width:110px}
.sr-row .zh{flex:1;color:var(--muted);font-size:14px}
#searchPanel:empty{display:none}
.sr-card{margin-top:12px;border:1px solid var(--line);border-radius:12px;padding:16px;background:#fff}
.sr-loading{color:var(--muted);font-size:14px;padding:6px 0}

@media (max-width:640px){
  .word{font-size:34px}
  .card-inner{min-height:320px}
  .face{padding:20px}
}
</style>
</head>
<body>

<header class="topbar">
  <div class="topbar-inner">
    <div class="brand">背单词<span>·</span>闪卡</div>
    <div class="grow"><input type="text" id="searchInput" placeholder="搜索单词：输入英文或中文，如 bus / 公交车"></div>
    <button class="btn primary" id="btnSearch">搜索</button>
    <button class="btn" id="btnNewCat" title="新建空词库（会自动导入匹配的内置主题）">＋ 新建词库</button>
    <select id="catSelect" style="flex:0 1 200px;width:auto;min-width:150px"></select>
    <label class="chk" title="创建词库后自动联网补齐音标 / 发音 / 图片"><input type="checkbox" id="autoEnrich"> 自动补齐</label>
    <div class="seg" id="modeSeg">
      <button data-mode="en2zh">正向 EN→中</button>
      <button data-mode="zh2en">反向 中→EN</button>
    </div>
  </div>
</header>

<div class="wrap">
  <nav class="tabs" id="tabs">
    <button data-tab="study" class="active">开始学习</button>
    <button data-tab="review">复盘</button>
    <button data-tab="manage">词条管理</button>
    <button data-tab="io">导入 / 导出</button>
  </nav>
  <div id="noticeBar"></div>
  <div id="searchPanel"></div>

  <!-- 学习 -->
  <section id="view-study" class="card-panel"></section>
  <!-- 复盘 -->
  <section id="view-review" class="card-panel hidden"></section>
  <!-- 管理 -->
  <section id="view-manage" class="card-panel hidden"></section>
  <!-- 导入导出 -->
  <section id="view-io" class="card-panel hidden"></section>
</div>

<div id="toast"></div>
<div id="modalRoot"></div>

<script>
(function () {
'use strict';

/* =====================================================================
   0. 常量与工具
   ===================================================================== */
var LS_KEY = 'vocabapp.v1';
var DAY = 86400000;
var INTERVALS = { 1: 1, 2: 3, 3: 7, 4: 14, 5: 30 };
var MAX_LEVEL = 6;
var REVIEW_WINDOW_DAYS = 7;

function uid(prefix) {
  return (prefix || 'id') + '_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
}
function $(sel, root) { return (root || document).querySelector(sel); }
function $$(sel, root) { return Array.prototype.slice.call((root || document).querySelectorAll(sel)); }
function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
}
function endOfToday(ts) { var d = new Date(ts || Date.now()); d.setHours(23, 59, 59, 999); return d.getTime(); }
function fmtDate(ts) {
  if (!ts) return '—';
  var d = new Date(ts);
  return (d.getMonth() + 1) + '/' + d.getDate();
}
function fmtDateTime(ts) {
  if (!ts) return '—';
  var d = new Date(ts);
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0') +
    ' ' + String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
}
function toast(msg, type) {
  var box = $('#toast');
  var el = document.createElement('div');
  if (type) el.className = type;
  el.textContent = msg;
  box.appendChild(el);
  setTimeout(function () { el.remove(); }, 2400);
}
function download(filename, content, mime) {
  var blob = new Blob([content], { type: (mime || 'text/plain') + ';charset=utf-8' });
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(function () { URL.revokeObjectURL(url); }, 4000);
}

/* =====================================================================
   1. 数据层（localStorage）
   ===================================================================== */
var state = loadState();

function defaultState() {
  return { version: 1, activeCategoryId: null, categories: [], settings: { autoEnrich: true } };
}
function normalizeWord(w) {
  w = w || {};
  return {
    id: w.id || uid('w'),
    en: String(w.en || '').trim(),
    phonetic: String(w.phonetic || '').trim(),
    zh: String(w.zh || '').trim(),
    example: String(w.example || '').trim(),
    image: String(w.image || '').trim(),
    audio: String(w.audio || '').trim(),
    level: Math.max(1, Math.min(MAX_LEVEL, parseInt(w.level, 10) || 1)),
    lastReview: w.lastReview || null,
    nextReview: w.nextReview || null,
    wrongLog: Array.isArray(w.wrongLog) ? w.wrongLog.filter(function (t) { return typeof t === 'number'; }) : [],
    createdAt: w.createdAt || Date.now(),
    updatedAt: w.updatedAt || Date.now()
  };
}
function loadState() {
  try {
    var raw = localStorage.getItem(LS_KEY);
    if (!raw) return defaultState();
    var s = JSON.parse(raw);
    if (!s || typeof s !== 'object') return defaultState();
    var out = defaultState();
    out.activeCategoryId = s.activeCategoryId || null;
    if (s.settings && typeof s.settings.autoEnrich === 'boolean') out.settings.autoEnrich = s.settings.autoEnrich;
    (Array.isArray(s.categories) ? s.categories : []).forEach(function (c) {
      if (!c || !c.id) return;
      out.categories.push({
        id: c.id,
        name: String(c.name || '未命名'),
        createdAt: c.createdAt || Date.now(),
        mode: c.mode === 'zh2en' ? 'zh2en' : 'en2zh',
        words: (Array.isArray(c.words) ? c.words : []).map(normalizeWord).filter(function (w) { return w.en || w.zh; })
      });
    });
    if (!out.categories.some(function (c) { return c.id === out.activeCategoryId; })) {
      out.activeCategoryId = out.categories.length ? out.categories[0].id : null;
    }
    return out;
  } catch (e) {
    return defaultState();
  }
}
function saveState() {
  try {
    localStorage.setItem(LS_KEY, JSON.stringify(state));
  } catch (e) {
    toast('保存失败：浏览器存储可能已满', 'bad');
  }
}

function families() { return state.categories; }
function activeCat() {
  return state.categories.filter(function (c) { return c.id === state.activeCategoryId; })[0] || null;
}
function findCatByName(name) {
  var n = String(name).trim().toLowerCase();
  return state.categories.filter(function (c) { return c.name.trim().toLowerCase() === n; })[0] || null;
}
function createCategory(name) {
  name = String(name || '').trim();
  if (!name) { toast('请先输入分类名称', 'bad'); return null; }
  var exist = findCatByName(name);
  if (exist) { toast('该分类已存在，已为你切换过去'); state.activeCategoryId = exist.id; saveState(); renderAll(); return exist; }
  var cat = { id: uid('cat'), name: name, createdAt: Date.now(), mode: 'en2zh', words: [] };
  state.categories.push(cat);
  state.activeCategoryId = cat.id;
  var pack = matchPack(name);
  if (pack) {
    var added = importPack(cat, pack);
    ui.lastImport = { catId: cat.id, packName: pack.n, count: added, ids: cat.words.map(function (w) { return w.id; }), removed: false };
    saveState(); renderAll();
    if (added) {
      toast('已创建「' + name + '」，自动导入 ' + added + ' 个词', 'ok');
    } else {
      toast('已创建「' + name + '」（词包里这些词已存在）', 'ok');
    }
    if (autoEnrichOn()) startEnrich(cat);
  } else {
    saveState(); renderAll();
    toast('已创建词库：' + name + '（没有匹配的内置主题，可手动导入）', 'ok');
  }
  return cat;
}
function deleteCategory(id) {
  var i = state.categories.findIndex(function (c) { return c.id === id; });
  if (i < 0) return;
  state.categories.splice(i, 1);
  state.activeCategoryId = state.categories.length ? state.categories[0].id : null;
  saveState(); renderAll();
}
function wordKey(s) { return String(s || '').trim().toLowerCase(); }
function findWord(cat, en) {
  var k = wordKey(en);
  return cat.words.filter(function (w) { return wordKey(w.en) === k; })[0] || null;
}

/* =====================================================================
   2. SRS
   ===================================================================== */
function intervalDays(level) {
  return level >= 5 ? INTERVALS[5] : (INTERVALS[level] || 1);
}
function applyReview(word, remembered, now) {
  now = now || Date.now();
  if (remembered) {
    word.level = Math.min((word.level || 1) + 1, MAX_LEVEL);
  } else {
    word.level = 1;
    word.wrongLog = (word.wrongLog || []).concat([now]);
    if (word.wrongLog.length > 200) word.wrongLog = word.wrongLog.slice(-200);
  }
  word.lastReview = now;
  word.nextReview = now + intervalDays(word.level) * DAY;
  word.updatedAt = now;
}
function isDue(word, now) {
  if (!word.nextReview) return true;
  return word.nextReview <= endOfToday(now);
}
function dueWords(cat, now) {
  return cat.words.filter(function (w) { return isDue(w, now); });
}
function recentWrongWords(cat, days) {
  var since = Date.now() - (days == null ? REVIEW_WINDOW_DAYS : days) * DAY;
  return cat.words.filter(function (w) {
    return (w.wrongLog || []).some(function (t) { return t >= since; });
  });
}

/* =====================================================================
   3. 发音（Web Speech API）
   ===================================================================== */
var voices = [];
function refreshVoices() {
  if (!('speechSynthesis' in window)) return;
  try { voices = window.speechSynthesis.getVoices() || []; } catch (e) { voices = []; }
}
if ('speechSynthesis' in window) {
  refreshVoices();
  window.speechSynthesis.onvoiceschanged = refreshVoices;
}
function pickUSVoice() {
  if (!voices.length) refreshVoices();
  var us = voices.filter(function (v) { return /en[-_]US/i.test(v.lang || ''); });
  var prefer = ['Google US English', 'Microsoft Aria', 'Microsoft Jenny', 'Microsoft Guy', 'Microsoft Zira', 'Samantha', 'Alex'];
  for (var i = 0; i < prefer.length; i++) {
    var hit = us.filter(function (v) { return (v.name || '').indexOf(prefer[i]) >= 0; })[0];
    if (hit) return hit;
  }
  if (us.length) return us[0];
  var anyEn = voices.filter(function (v) { return /^en/i.test(v.lang || ''); });
  return anyEn[0] || null;
}
function speak(text) {
  text = String(text || '').trim();
  if (!text) return;
  if (!('speechSynthesis' in window)) { toast('当前浏览器不支持语音合成', 'bad'); return; }
  try {
    window.speechSynthesis.cancel();
    var u = new SpeechSynthesisUtterance(text);
    u.lang = 'en-US';
    u.rate = 0.9;
    u.pitch = 1;
    var v = pickUSVoice();
    if (v) u.voice = v;
    window.speechSynthesis.speak(u);
  } catch (e) { toast('发音失败', 'bad'); }
}

/* =====================================================================
   4. CSV / 智能导入
   ===================================================================== */
var HEADER_MAP = {
  en: ['en', 'eng', 'english', 'word', 'words', 'spelling', 'term', '单词', '英文', '英语', '词汇', '词条', '词'],
  phonetic: ['phonetic', 'ipa', 'pronunciation', 'phonics', '音标', '美式音标', '英式音标', '英标', '读音', '发音'],

    if (!en) return null;
    return { en: en, zh: zh };
  }).filter(Boolean);
}
function importPack(cat, pack) {
  var items = parsePack(pack), n = 0;
  items.forEach(function (it) {
    if (findWord(cat, it.en)) return;
    cat.words.push(normalizeWord({ en: it.en, zh: it.zh }));
    n++;
  });
  return n;
}

/* ---------- 联网补齐 ---------- */
var enrich = { running: false, cancel: false, catId: null, done: 0, total: 0, mphon: 0, maudio: 0, mimage: 0 };
var audioEl = null;
var enrichUseCommons = false;

function autoEnrichOn() { return !(state.settings && state.settings.autoEnrich === false); }

function playWord(w) {
  if (!w) return;
  var text = String(w.en || '').trim();
  if (w.audio) {
    try {
      if (!audioEl) audioEl = new Audio();
      audioEl.pause();
      audioEl.src = w.audio;
      var p = audioEl.play();
      if (p && p.catch) p.catch(function () { speak(text); });
      return;
    } catch (e) { /* fall through */ }
  }
  speak(text);
}

function fetchJSON(url, ms) {
  return new Promise(function (resolve, reject) {
    var ctl = ('AbortController' in window) ? new AbortController() : null;
    var timer = setTimeout(function () { if (ctl) ctl.abort(); reject(new Error('timeout')); }, ms || 9000);
    fetch(url, ctl ? { signal: ctl.signal } : {})
      .then(function (r) {
        clearTimeout(timer);
        if (!r.ok) throw new Error('HTTP ' + r.status);
        return r.json();
      })
      .then(resolve)
      .catch(function (e) { clearTimeout(timer); reject(e); });
  });
}
function needsEnrich(w) { return !w.phonetic || !w.audio || !w.image || !w.example; }

async function enrichOne(w) {
  var changed = false;
  if (!w.phonetic || !w.audio || !w.example) {
    try {
      var j = await fetchJSON('https://api.dictionaryapi.dev/api/v2/entries/en/' + encodeURIComponent(w.en), 9000);
      var e = Array.isArray(j) ? j[0] : null;
      if (e) {
        var usAudio = '', anyAudio = '', phon = '', ex = '';
        (e.phonetics || []).forEach(function (p) {
          if (p.audio) {
            if (!anyAudio) anyAudio = p.audio;
            if (/-us\./i.test(p.audio)) usAudio = p.audio;
          }
          if (p.text && !phon) phon = p.text;
        });
        if (!phon && e.phonetic) phon = e.phonetic;
        (e.meanings || []).forEach(function (m) {
          (m.definitions || []).forEach(function (d) { if (!ex && d.example) ex = d.example; });
        });
        if (phon && !w.phonetic) { w.phonetic = phon; enrich.mphon++; changed = true; }
        if (!w.audio && (usAudio || anyAudio)) { w.audio = usAudio || anyAudio; enrich.maudio++; changed = true; }
        if (!w.example && ex) { w.example = ex; changed = true; }
      }
    } catch (err) { /* 拿不到就留空，不阻塞 */ }
  }
  if (!w.image) { w.image = bingThumb(w.en); enrich.mimage++; changed = true; }
  if (changed) w.updatedAt = Date.now();
  return changed;
}
function flickrImage(word) {
  return 'https://loremflickr.com/480/360/' + encodeURIComponent(word) + '?lock=' + ((word.length * 7) % 97);
}
async function probeCommons() {
  try {
    await fetchJSON('https://commons.wikimedia.org/w/api.php?action=query&format=json&titles=Main%20Page&origin=*', 3000);
    return true;
  } catch (e) { return false; }
}
async function commonsImage(word, useCommons) {
  if (useCommons) {
    try {
      var api = 'https://commons.wikimedia.org/w/api.php?action=query&generator=search&gsrsearch=' +
        encodeURIComponent(word) + '&gsrnamespace=6&gsrlimit=8&prop=imageinfo&iiprop=url&iiurlwidth=480&format=json&origin=*';
      var j = await fetchJSON(api, 4000);
      var pages = (j && j.query && j.query.pages) ? Object.keys(j.query.pages).map(function (k) { return j.query.pages[k]; }) : [];
      var pick = '';
      pages.forEach(function (p) {
        var info = p.imageinfo && p.imageinfo[0];
        if (!info) return;
        var u = info.thumburl || info.url || '';
        if (!u || /\.(svg|tif|tiff|gif|webm|ogv|ogg|pdf)$/i.test(u)) return;
        if (!pick) pick = u;
        else if (/\.(jpe?g|png)$/i.test(u) && !/\.(jpe?g|png)$/i.test(pick)) pick = u;
      });
      if (pick) return pick;
    } catch (e) { /* 超时或被墙就换图源 */ }
  }
  return flickrImage(word);
}
function startEnrich(cat) {
  if (!cat) return;
  if (enrich.running) { toast('补齐任务正在进行中，先等等'); return; }
  var targets = cat.words.filter(needsEnrich);
  if (!targets.length) { toast('这个分类不需要补齐', 'ok'); return; }
  enrich.running = true; enrich.cancel = false; enrich.catId = cat.id;
  enrich.done = 0; enrich.total = targets.length;
  enrich.mphon = 0; enrich.maudio = 0; enrich.mimage = 0;
  renderAll();
  var idx = 0;
  function worker() {
    if (enrich.cancel || idx >= targets.length) return Promise.resolve();
    var w = targets[idx++];
    return enrichOne(w).then(function () {
      enrich.done++;
      if (enrich.done % 3 === 0) { saveState(); renderAll(); }
      return worker();
    }, function () { enrich.done++; return worker(); });
  }
  var workers = [];
  for (var i = 0; i < 3; i++) workers.push(worker());
  Promise.all(workers).then(function () {
    enrich.running = false;
    saveState(); renderAll();
    toast('补齐完成：音标 ' + enrich.mphon + ' · 发音 ' + enrich.maudio + ' · 图片 ' + enrich.mimage, 'ok');
  });
}

function picHtml(primary, word) {

var searchCache = {};
var searchState = { q: '', results: [], active: -1, detail: null, busy: false };

function searchBuiltin(q) {
  var isCJK = CJK_RE.test(q);
  var ql = q.toLowerCase();
  var map = {};
  PACKS.forEach(function (p) {
    parsePack(p).forEach(function (it) {
      var e = it.en.toLowerCase();
      var hit = isCJK ? (it.zh.indexOf(q) >= 0) : (e === ql || e.indexOf(ql) === 0);
      if (!hit) return;
      var key = e;
      if (!map[key]) map[key] = { en: it.en, zh: it.zh, packs: [] };
      if (map[key].packs.indexOf(p.n) < 0) map[key].packs.push(p.n);
    });
  });
  return Object.keys(map).map(function (k) { return map[k]; });
}
async function lookupWord(en) {
  if (searchCache[en]) return searchCache[en];
  var rec = { phonetic: '', audio: '', example: '' };
  try {
    var j = await fetchJSON('https://api.dictionaryapi.dev/api/v2/entries/en/' + encodeURIComponent(en), 8000);
    var e = Array.isArray(j) ? j[0] : null;
    if (e) {
      var us = '', any = '', ph = '', ex = '';
      (e.phonetics || []).forEach(function (p) {
        if (p.audio) { if (!any) any = p.audio; if (/-us\./i.test(p.audio)) us = p.audio; }
        if (p.text && !ph) ph = p.text;
      });
      if (!ph && e.phonetic) ph = e.phonetic;
      (e.meanings || []).forEach(function (m) {
        (m.definitions || []).forEach(function (d) { if (!ex && d.example) ex = d.example; });
      });
      rec.phonetic = ph; rec.audio = us || any; rec.example = ex;
    }
  } catch (err) { /* 网络不通就留空 */ }
  searchCache[en] = rec;
  return rec;
}
async function translateText(text, from, to) {
  try {
    var j = await fetchJSON('https://api.mymemory.translated.net/get?q=' + encodeURIComponent(text) +
      '&langpair=' + from + '|' + to, 8000);
    var t = j && j.responseData && j.responseData.translatedText;
    if (t) return String(t).trim();
  } catch (err) { /* ignore */ }
  return '';
}

async function doSearch() {
  var q = ($('#searchInput').value || '').trim();
  if (!q) { toast('先输入英文单词或中文', 'bad'); return; }

  searchState.detail = null; searchState.busy = true;
  renderSearchPanel();
  var isCJK = CJK_RE.test(q);
  var hits = searchBuiltin(q);
  hits.sort(function (a, b) { return (a.zh.length - b.zh.length) || a.en.localeCompare(b.en); });
  searchState.results = hits.slice(0, 80);
  searchState.busy = false;
  if (searchState.results.length === 1) { await openSearchDetail(0); return; }
  if (searchState.results.length === 0) {
    var en = q, zh = '';
    if (isCJK) en = await translateText(q, 'zh-CN', 'en');
    if (!en || CJK_RE.test(en)) { toast('没查到这个词，换个说法试试', 'bad'); renderSearchPanel(); return; }
    if (!isCJK) zh = await translateText(q, 'en', 'zh-CN');
    searchState.results = [{ en: en, zh: zh, packs: [], external: true }];
    await openSearchDetail(0);
    return;
  }
  renderSearchPanel();
}

}

function startSession(words, kind) {
  var cat = activeCat();
  if (!cat || !words.length) { toast('没有可学的单词', 'bad'); return; }
  ui.session = {
    catId: cat.id, kind: kind, queue: words.map(function (w) { return w.id; }),
    idx: 0, remembered: 0, forgot: 0, dead: false, batchIds: words.map(function (w) { return w.id; })
  };
  renderStudy();
}
function sessionWord(s) {
  var cat = activeCat(); if (!cat) return null;
  var id = s.queue[s.idx];
  return cat.words.filter(function (w) { return w.id === id; })[0] || null;
}
function renderSession(box, s) {
  var cat = activeCat();
  var w = sessionWord(s);
  var total = s.queue.length;
  if (!w) {
    var pct = 100;
    box.innerHTML =
      '<div class="progress"><i style="width:' + pct + '%"></i></div>' +
      '<div class="empty"><h3>这一轮学完了 🎉</h3>' +

        '<div class="stat"><b style="color:var(--ok)">' + s.remembered + '</b><span>记住</span></div>' +
        '<div class="stat"><b style="color:var(--bad)">' + s.forgot + '</b><span>没记住</span></div>' +
        '<div class="stat"><b>' + total + '</b><span>张卡</span></div>' +
      '</div>' +
      (s.kind === 'review'
        ? '<p class="muted small">复盘结束。要不要把这批单词的记忆等级重置为 Lv1，明天重新开始？</p>' +
          '<div class="study-actions"><button class="btn bad" id="btnResetBatch">把本轮 ' + s.batchIds.length + ' 个词重置为 Lv1</button>' +
          '<button class="btn" id="btnEndSession">先不了</button></div>'

      '</div>';
    var ra = $('#btnResetBatch');
    if (ra) ra.onclick = function () {
      var now = Date.now();
      s.batchIds.forEach(function (id) {
        var t = cat.words.filter(function (x) { return x.id === id; })[0];
        if (t) { t.level = 1; t.lastReview = now; t.nextReview = now + DAY; t.updatedAt = now; }
      });
      saveState(); ui.session = null; renderAll();
      toast('已重置 ' + s.batchIds.length + ' 个词到 Lv1', 'ok');
    };
    var ag = $('#btnAgain');
    if (ag) ag.onclick = function () { ui.session = null; renderAll(); };
    var es = $('#btnEndSession');
    if (es) es.onclick = function () { ui.session = null; renderAll(); };
    return;
  }
  var pct = Math.round((s.idx / total) * 100);
  var fwd = cat.mode === 'en2zh';
  var front = fwd ? (w.en || '（缺英文）') : (w.zh || '（缺中文释义）');
  var backMain = fwd ? (w.zh || '（缺中文释义）') : (w.en || '（缺英文）');

  box.innerHTML =

    '</div>' +

              '<div class="zh-mean">' + esc(backMain) + '</div>'
            : '<div class="word">' + esc(backMain) + '</div>' +
              '<div class="row" style="margin-top:10px"><button class="speak" id="btnSpeak">🔊 美式发音</button></div>' +
              '<div class="phon">' + esc(w.phonetic || '—') + '</div>') +
          (w.example ? '<div class="example">' + esc(w.example) + '</div>' : '') +
          picHtml(w.image, w.en) +

    card.classList.toggle('flipped');
  };
  $('#btnSpeak').onclick = function (e) { e.stopPropagation(); playWord(w); };
  $('#btnSpeak2').onclick = function () { playWord(w); };
  $('#btnRemember').onclick = function () { grade(s, true); };
  $('#btnForgot').onclick = function () { grade(s, false); };
  $('#btnSkip').onclick = function () { s.idx++; renderStudy(); };
  $('#btnPrev').onclick = function () { if (s.idx > 0) { s.idx--; renderStudy(); } };
}
function grade(s, remembered) {
  var cat = activeCat(); if (!cat) return;
  var w = sessionWord(s); if (!w) return;
  applyReview(w, remembered);
  if (remembered) s.remembered++; else s.forgot++;
  saveState();
  s.idx++;
  renderAll();
}

      ? '<div class="table-wrap"><table><thead><tr><th>英文</th><th>音标</th><th>中文释义</th><th>例句</th><th>等级</th><th>下次复习</th><th>操作</th></tr></thead><tbody>' + rows + '</tbody></table></div>'
      : '<div class="empty"><h3>' + (kw ? '没搜到匹配的词' : '这个分类还没有单词') + '</h3></div>');
  $('#btnAddWord').onclick = function () { openWordModal(null); };

  $('#btnDelCat').onclick = function () {
    if (confirm('确定删除分类「' + cat.name + '」及其 ' + cat.words.length + ' 个单词？此操作不可撤销。')) {
      deleteCategory(cat.id); toast('已删除分类', 'ok');
    }
  };
  var se = $('#manageSearch');
  se.oninput = function () { ui.search = se.value; var pos = se.selectionStart; renderManage(); var n = $('#manageSearch'); if (n) { n.focus(); try { n.setSelectionRange(pos, pos); } catch (e) {} } };
  $$('[data-edit]', box).forEach(function (b) { b.onclick = function () { openWordModal(b.dataset.edit); }; });
  $$('[data-del]', box).forEach(function (b) {
    b.onclick = function () {
      var w = cat.words.filter(function (x) { return x.id === b.dataset.del; })[0];
      if (!w) return;
      if (confirm('删除「' + w.en + '」？')) {
        cat.words = cat.words.filter(function (x) { return x.id !== w.id; });
        saveState(); renderAll(); toast('已删除', 'ok');
      }
    };

    b.onclick = function () {
      var w = cat.words.filter(function (x) { return x.id === b.dataset.say; })[0];
      if (w) speak(w.en);
    };
  });
}

function openWordModal(id) {
  var cat = activeCat(); if (!cat) return;
  var w = id ? cat.words.filter(function (x) { return x.id === id; })[0] : null;
  var isNew = !w;
  if (isNew) w = normalizeWord({});
  var html =
    '<div class="mask" id="mask"><div class="modal">' +
      '<h3>' + (isNew ? '新增单词' : '编辑单词') + '</h3>' +
      '<div class="body">' +
        '<div class="grid2">' +
          '<div class="field"><label>英文 *</label><input type="text" id="f_en" value="' + esc(w.en) + '"></div>' +
          '<div class="field"><label>美式音标</label><input type="text" id="f_ph" value="' + esc(w.phonetic) + '" placeholder="/əˈbændən/"></div>' +
        '</div>' +
        '<div class="field"><label>中文释义</label><input type="text" id="f_zh" value="' + esc(w.zh) + '"></div>' +
        '<div class="field"><label>例句</label><textarea id="f_ex" rows="3">' + esc(w.example) + '</textarea></div>' +
        '<div class="field"><label>图片链接</label><input type="url" id="f_img" value="' + esc(w.image) + '" placeholder="https://..."></div>' +
        (isNew ? '' : '<div class="field"><label>记忆等级（1–6）</label><input type="text" id="f_lv" value="' + w.level + '"></div>') +
      '</div>' +
      '<div class="foot">' +
        '<button class="btn" id="mCancel">取消</button>' +
        '<button class="btn primary" id="mSave">保存</button>' +
      '</div>' +
    '</div></div>';
  $('#modalRoot').innerHTML = html;
  $('#mCancel').onclick = closeModal;
  $('#mask').onclick = function (e) { if (e.target.id === 'mask') closeModal(); };
  $('#mSave').onclick = function () {
    var en = $('#f_en').value.trim();
    if (!en) { toast('英文不能为空', 'bad'); return; }
    var data = {
      en: en,
      phonetic: $('#f_ph').value.trim(),
      zh: $('#f_zh').value.trim(),
      example: $('#f_ex').value.trim(),
      image: $('#f_img').value.trim()
    };
    if (isNew) {
      var dup = findWord(cat, en);
      if (dup) {
        Object.assign(dup, data, { updatedAt: Date.now() });
      } else {
        cat.words.push(normalizeWord(data));
      }
    } else {
      Object.assign(w, data, { updatedAt: Date.now() });
      var lv = parseInt($('#f_lv').value, 10);
      if (!isNaN(lv)) w.level = Math.max(1, Math.min(MAX_LEVEL, lv));
    }
    saveState(); closeModal(); renderAll(); toast('已保存', 'ok');
  };
  setTimeout(function () { var el = $('#f_en'); if (el) el.focus(); }, 30);
}
function closeModal() { $('#modalRoot').innerHTML = ''; }

/* ---------- 导入 / 导出 ---------- */

  $('#btnExpCsv').onclick = function () { exportCategoryCSV(cat); };
  $('#btnExpJson').onclick = function () {
    download('vocab_backup_' + new Date().toISOString().slice(0, 10) + '.json', JSON.stringify(state, null, 2), 'application/json');
    toast('已导出备份', 'ok');
  };
  $('#btnClearPaste').onclick = function () { $('#pasteCsv').value = ''; ui.importDraft = null; $('#sniffBox').innerHTML = ''; };
  $('#fileCsv').onchange = function (e) {
    var f = e.target.files[0]; if (!f) return;
    var fr = new FileReader();
    fr.onload = function () { $('#pasteCsv').value = String(fr.result || ''); runSniff(); };
    fr.readAsText(f, 'utf-8');
  };
  $('#btnSniff').onclick = runSniff;
  $('#fileJson').onchange = function (e) {
    var f = e.target.files[0]; if (!f) return;
    var fr = new FileReader();
    fr.onload = function () {
      try {
        var obj = JSON.parse(String(fr.result || '{}'));
        if (!obj || !Array.isArray(obj.categories)) throw new Error('格式不对');
        if (!confirm('将用备份覆盖当前全部数据（' + obj.categories.length + ' 个分类），确定？')) return;

        state = loadState(); ui.session = null; renderAll();
        toast('已恢复备份', 'ok');
      } catch (err) { toast('备份文件解析失败', 'bad'); }
    };
    fr.readAsText(f, 'utf-8');
  };
  if (ui.importDraft) renderSniffBox();
}

function runSniff() {
  var text = $('#pasteCsv').value;
  if (!text.trim()) { toast('先粘贴或选择 CSV 内容', 'bad'); return; }
  try {
    var res = sniffText(text);
    if (!res.dataRows.length) { toast('没解析出数据行', 'bad'); return; }
    ui.importDraft = res;
    renderSniffBox();
    toast('识别完成，请核对列对应关系', 'ok');
  } catch (e) { toast('解析失败：' + e.message, 'bad'); }
}

  var delimName = { ',': '逗号 ,', '\t': '制表符 Tab', ';': '分号 ;', '|': '竖线 |' }[d.delimiter] || d.delimiter;

    headRow += '<tr>' +
      '<td>第 ' + (c + 1) + ' 列</td>' +
      '<td><select data-col="' + c + '">' + opts + '</select></td>' +

  }).join('');

    '<div class="card-panel" style="box-shadow:none;background:#fafbfc">' +
      '<div class="row" style="margin-bottom:10px">' +
        '<span class="pill">分隔符：' + delimName + '</span>' +
        '<span class="pill">' + (d.hasHeader ? '检测到表头（已跳过）' : '没检测到表头') + '</span>' +
        '<span class="pill lv">' + d.dataRows.length + ' 行数据</span>' +
      '</div>' +
      '<table class="maptable"><thead><tr><th>来源</th><th>识别为</th><th>样例</th></tr></thead><tbody>' + headRow + '</tbody></table>' +
      '<details style="margin-top:12px"><summary class="muted small" style="cursor:pointer">预览前 5 行</summary>' +
      '<div class="table-wrap" style="margin-top:8px"><table class="maptable"><tbody>' + preview + '</tbody></table></div></details>' +
      '<div class="row" style="margin-top:14px">' +
        '<button class="btn primary" id="btnDoImport">确认导入</button>' +
        '<button class="btn" id="btnCancelImport">取消</button>' +
      '</div>' +
    '</div>';
  $$('#sniffBox select[data-col]').forEach(function (s) {
    s.onchange = function () {
      var col = parseInt(s.dataset.col, 10);
      var val = s.value;
      if (val) {
        for (var i = 0; i < ui.importDraft.roles.length; i++) {
          if (i !== col && ui.importDraft.roles[i] === val) ui.importDraft.roles[i] = '';
        }
      }
      ui.importDraft.roles[col] = val;
      renderSniffBox();
    };
  });
  $('#btnCancelImport').onclick = function () { ui.importDraft = null; renderSniffBox(); };
  $('#btnDoImport').onclick = doImport;
}

function doImport() {
  var d = ui.importDraft;
  var cat = activeCat();
  if (!cat) { toast('请先创建词库', 'bad'); return; }
  var idx = {};
  d.roles.forEach(function (r, i) { if (r && idx[r] === undefined) idx[r] = i; });
  if (idx.en === undefined) { toast('没识别出「英文」列，请手动指定', 'bad'); return; }

  var added = 0, updated = 0, skipped = 0;
  var now = Date.now();
  d.dataRows.forEach(function (row) {
    var en = String(row[idx.en] || '').trim();
    if (!en || matchHeader(en)) { skipped++; return; }
    if (idx.zh !== undefined && String(row[idx.zh] || '').trim() === '' && String(row[idx.en] || '').trim() === '') { skipped++; return; }
    var payload = {
      en: en,
      zh: idx.zh !== undefined ? String(row[idx.zh] || '').trim() : '',
      phonetic: idx.phonetic !== undefined ? String(row[idx.phonetic] || '').trim() : '',
      example: idx.example !== undefined ? String(row[idx.example] || '').trim() : '',
      image: idx.image !== undefined ? String(row[idx.image] || '').trim() : '',
      audio: idx.audio !== undefined ? String(row[idx.audio] || '').trim() : ''
    };
    var exist = findWord(cat, en);
    if (exist) {
      Object.keys(payload).forEach(function (k) {
        if (k !== 'en' && payload[k]) exist[k] = payload[k];
      });
      exist.updatedAt = now;
      updated++;
    } else {
      cat.words.push(normalizeWord(payload));
      added++;
    }
  });
  saveState(); ui.importDraft = null; renderAll();
  $('#sniffBox') && ($('#sniffBox').innerHTML = '');
  toast('导入完成：新增 ' + added + '，更新 ' + updated + (skipped ? '，跳过 ' + skipped : ''), 'ok');
}

/* =====================================================================
   6. 事件绑定 & 启动
   ===================================================================== */
$('#btnSearch').onclick = function () { doSearch(); };
$('#searchInput').addEventListener('keydown', function (e) { if (e.key === 'Enter') doSearch(); });
$('#btnNewCat').onclick = openNewCatModal;
var acBox = $('#autoEnrich');
if (acBox) {
  acBox.checked = autoEnrichOn();
  acBox.onchange = function () {
    if (!state.settings) state.settings = { autoEnrich: true };
    state.settings.autoEnrich = acBox.checked;
    saveState();
    toast(acBox.checked ? '已开启：创建词库后自动补齐音标/发音/图片' : '已关闭自动补齐');
  };
}
$('#catSelect').onchange = function (e) {
  state.activeCategoryId = e.target.value;
  ui.session = null;
  saveState(); renderAll();
};
$$('#modeSeg button').forEach(function (b) {
  b.onclick = function () {
    var cat = activeCat(); if (!cat) { toast('先创建词库', 'bad'); return; }
    cat.mode = b.dataset.mode;
    if (ui.session) ui.session.dead = true;
    saveState(); renderAll();
  };
});
$$('#tabs button').forEach(function (b) {
  b.onclick = function () { ui.tab = b.dataset.tab; renderAll(); };
});
document.addEventListener('keydown', function (e) {
  var tag = (e.target.tagName || '').toLowerCase();
  if (tag === 'input' || tag === 'textarea' || tag === 'select') return;
  if (ui.tab !== 'study' && ui.tab !== 'review') return;
  var s = ui.session;
  if (!s || s.dead) return;
  var card = $('#card');
  if (!card) return;
  if (e.code === 'Space' || e.key === ' ') { e.preventDefault(); card.classList.toggle('flipped'); }
  else if (e.key === '1') { grade(s, true); }
  else if (e.key === '2') { grade(s, false); }
  else if (e.key === 's' || e.key === 'S') { var w = sessionWord(s); if (w) playWord(w); }
  else if (e.key === 'ArrowRight') { s.idx++; renderAll(); }
  else if (e.key === 'ArrowLeft') { if (s.idx > 0) { s.idx--; renderAll(); } }
});

renderAll();
})();
</script>
</body>
</html>
