<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Snow Lexis · 词库之树，枝枝相筑</title>
  <meta name="description" content="Snow Lexis：一个单词一张卡片，卡片内多条释义，词性标签与语义标签绑定在释义上，内置艾宾浩斯记忆曲线背诵模式。">
  <meta name="robots" content="noindex, nofollow">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#4f7096">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Snow Lexis">
  <link rel="apple-touch-icon" href="assets/icon-192.png">
  <link rel="icon" type="image/png" href="assets/icon-192.png">
  <!-- ?v= 版本号用于穿透浏览器缓存，改动资源后请同步改这里 -->
  <link rel="stylesheet" href="assets/css/styles.css?v=20261011b">
</head>
<body>
  <header class="site-header">
    <div class="wrap header-inner">
      <a class="brand" href="#/">
        <img class="brand-mark" src="assets/snow-lexis-mark.png" alt="Snow Lexis">
        <span class="brand-text">
          <strong>Snow Lexis</strong>
          <small>词库之树，枝枝相筑</small>
        </span>
      </a>
      <nav class="site-nav">
        <a class="nav-link" data-nav="home" href="#/">首页</a>
        <button type="button" class="nav-link nav-btn" data-action="open-tree">词库树</button>
        <a class="nav-link" data-nav="favorites" href="#/favorites">我的收藏<span class="pill fav-count" hidden>0</span></a>
        <a class="nav-link" data-nav="settings" href="#/settings">设置</a>
      </nav>
    </div>
  </header>

  <main id="view" class="wrap" aria-live="polite"></main>

  <!-- 词库树弹窗 -->
  <div class="modal" id="treeModal" hidden>
    <div class="modal-mask" data-action="close-tree"></div>
    <div class="modal-dialog" role="dialog" aria-modal="true" aria-label="词库树">
      <header class="modal-head">
        <h2 id="treeTitle">词库树</h2>
        <div class="head-actions">
          <button type="button" class="btn-fav" id="treeEditBtn" data-action="open-tree-editor">✎ 编辑分类名</button>
          <button type="button" class="icon-btn" data-action="close-tree" aria-label="关闭">✕</button>
        </div>
      </header>
      <p class="tree-path is-placeholder" id="treeSelectedPath">请逐级展开，选择末级分类</p>
      <div class="tree-body" id="treeBody"></div>
      <footer class="modal-foot">
        <span class="tree-hint" id="treeHint">点击分类名逐级展开，末级分类可打开词库</span>
        <div class="modal-actions" id="treeActions" hidden>
          <button type="button" class="btn btn-ghost" data-action="cancel-tree">取消</button>
          <button type="button" class="btn btn-primary" data-action="open-branch-selected">打开词库</button>
        </div>
      </footer>
    </div>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <!-- 新手引导（聚光灯）：不吃点击，只把目标挖亮，用户可以真的点 -->
  <div class="tour" id="tour" hidden>
    <div class="tour-hole" id="tourHole" hidden></div>
    <button type="button" class="tour-exit" data-action="tour-skip">跳过引导</button>
    <div class="tour-tip" id="tourTip">
      <span class="tour-step" id="tourStep">第 1 步</span>
      <h3 id="tourTitle">—</h3>
      <p id="tourText">—</p>
      <div class="tour-foot" id="tourFoot"></div>
    </div>
  </div>

  <!-- 编辑卡片弹窗（卡片右上角 ⋯ → 编辑卡片） -->
  <div class="modal" id="editModal" hidden>
    <div class="modal-mask" data-action="close-editor"></div>
    <div class="modal-dialog edit-dialog" role="dialog" aria-modal="true" aria-label="编辑卡片">
      <header class="modal-head">
        <h2 id="editTitle">编辑卡片</h2>
        <button type="button" class="icon-btn" data-action="close-editor" aria-label="关闭">✕</button>
      </header>
      <p class="tree-path is-placeholder" id="editSub">—</p>
      <div class="import-body" id="editBody"></div>
      <footer class="modal-foot" id="editFoot"></footer>
      <input type="file" id="editImgFile" accept="image/*" hidden>
    </div>
  </div>

  <!-- 词库树编辑器（词库树弹窗 → ✎ 编辑分类名） -->
  <div class="modal" id="treeEditModal" hidden>
    <div class="modal-mask" data-action="close-tree-editor"></div>
    <div class="modal-dialog tree-edit-dialog" role="dialog" aria-modal="true" aria-label="编辑词库树">
      <header class="modal-head">
        <h2>编辑词库树</h2>
        <button type="button" class="icon-btn" data-action="close-tree-editor" aria-label="关闭">✕</button>
      </header>
      <p class="tree-path is-placeholder" id="treeEditSub">—</p>
      <div class="import-body" id="treeEditBody"></div>
      <footer class="modal-foot" id="treeEditFoot"></footer>
    </div>
  </div>

  <!-- 通用确认弹窗（删除释义等破坏性操作） -->
  <div class="modal" id="confirmModal" hidden>
    <div class="modal-mask" data-action="confirm-no"></div>
    <div class="modal-dialog confirm-dialog" role="dialog" aria-modal="true" aria-label="确认">
      <header class="modal-head">
        <h2 id="confirmTitle">确认</h2>
        <button type="button" class="icon-btn" data-action="confirm-no" aria-label="关闭">✕</button>
      </header>
      <p class="confirm-text" id="confirmText">—</p>
      <footer class="modal-foot" id="confirmFoot"></footer>
    </div>
  </div>

  <!-- 导入新词弹窗（词库页「导入新词」按钮唤起） -->
  <div class="modal" id="importModal" hidden>
    <div class="modal-mask" data-action="close-import"></div>
    <div class="modal-dialog import-dialog" role="dialog" aria-modal="true" aria-label="导入新词">
      <header class="modal-head">
        <h2>导入新词</h2>
        <button type="button" class="icon-btn" data-action="close-import" aria-label="关闭">✕</button>
      </header>
      <p class="tree-path" id="importTarget">将导入到：—</p>
      <div class="import-body" id="importBody"></div>
      <footer class="modal-foot" id="importFoot"></footer>
    </div>
  </div>

  <!-- 数据层：tree.js（分类树）→ words.js（词库原始数据）→ data.js（规范化 + 索引） -->
  <script src="assets/js/tree.js?v=20261011b"></script>
  <script src="assets/js/words.js?v=20261011b"></script>
  <!-- 批量导入词库（由 tools/export-to-site.js 生成，默认空文件） -->
  <script src="assets/js/words-cet6.js?v=20261011b"></script>
  <!-- Wiktionary 常用词表（25k 词，由 tools/import-wiktextract.js 生成；必须放在最后，保证已有词 id 不变） -->
  <script src="assets/js/words-wiki.js?v=20261011b"></script>
  <!-- 单词配图地址表（可选，可由 tools/resolve-images.js 自动生成） -->
  <script src="assets/js/images.js?v=20261011b"></script>
  <script src="assets/js/data.js?v=20261011b"></script>
  <script src="assets/js/review.js?v=20261011b"></script>
  <script src="assets/js/api.js?v=20261011b"></script>
  <script src="assets/js/app.js?v=20261011b"></script>
</body>
</html>
